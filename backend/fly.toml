# Hosted ExiThreat API. Deploy from this folder: fly deploy
# Secrets (fly secrets set): DATABASE_URL (set by `fly postgres attach`), JWT_SECRET,
# and PROMIC_SERVICE_ACCOUNT_JSON for the ProMic backups page.

app = 'exithreat-api'
primary_region = 'sin'

[build]

[env]
  PORT = '4000'
  TRUST_PROXY = '1'
  FRONTEND_ORIGIN = 'https://exithreat.iyugam.com,https://exithreat-admin.iyugam.com,https://exithreat.fly.dev'
  PROMIC_DATABASE_URL = 'https://promic-c5567-default-rtdb.firebaseio.com'
  PROMIC_STORAGE_BUCKET = 'promic-c5567.firebasestorage.app'
  # The AI redactor (../redactor), on Fly's private network only; it sleeps when idle.
  # Turned off for now (its machine is stopped): without REDACTOR_URL only the patterns run.
  # To turn it on: uncomment, start the machine with autostart, and deploy.
  # REDACTOR_URL = 'http://exithreat-redactor.flycast'

[http_service]
  internal_port = 4000
  force_https = true
  # Kept running: the hourly push sweep and the pages that poll need it awake.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = 'GET'
    path = '/api/health'
    interval = '30s'
    timeout = '5s'
    grace_period = '60s'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
