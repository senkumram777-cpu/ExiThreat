# Hosted ExiThreat API. Deploy from this folder: fly deploy
# Secrets (fly secrets set): DATABASE_URL (set by `fly postgres attach`), JWT_SECRET,
# and PROMIC_SERVICE_ACCOUNT_JSON for the ProMic backups page.

app = 'exithreat-api'
primary_region = 'sin'

[build]

[env]
  PORT = '4000'
  TRUST_PROXY = '1'
  FRONTEND_ORIGIN = 'https://exithreat.fly.dev'
  PROMIC_DATABASE_URL = 'https://promic-c5567-default-rtdb.firebaseio.com'
  PROMIC_STORAGE_BUCKET = 'promic-c5567.firebasestorage.app'

[http_service]
  internal_port = 4000
  force_https = true
  # Kept running: the push observer polls votes every 10 seconds.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = 'GET'
    path = '/api/health'
    interval = '30s'
    timeout = '5s'
    grace_period = '60s'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
